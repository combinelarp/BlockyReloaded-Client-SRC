name: Build Client (Linux)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            build-essential \
            cmake \
            ccache \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libssl-dev

      - name: Build client
        run: |
          chmod +x dev/deploy/build_client.sh
          ./dev/deploy/build_client.sh 4

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-linux-build
          path: |
            dev/client/Bin/
            dev/client/build/
          if-no-files-found: ignore